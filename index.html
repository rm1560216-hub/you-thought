<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>You Thought.</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="A tiny, innocent platformer." />
    <meta name="theme-color" content="#07090f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07090f;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, sans-serif;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #wrap {
        position: relative;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        -webkit-touch-callout: none;
      }
      #ov {
        position: absolute;
        inset: 0;
        display: none;
        background: rgba(0, 0, 0, 0.68);
        color: #fff;
        text-align: center;
      }
      #msg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(92%, 900px);
        font-size: clamp(22px, 4vw, 44px);
        font-weight: 600;
        line-height: 1.15;
        overflow-wrap: anywhere;
      }
      #msg.big {
        font-size: clamp(30px, 8vw, 96px);
        font-weight: 800;
      }
      #bt {
        position: absolute;
        left: 50%;
        bottom: 8%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
      }
      #bt button,
      #pz {
        font: 700 clamp(16px, 2.4vw, 24px) system-ui;
        padding: 0.5em 1.4em;
        border: 2px solid #fff;
        border-radius: 8px;
        background: #fff;
        color: #07090f;
        cursor: pointer;
        touch-action: none;
      }
      #bt button.alt {
        background: transparent;
        color: #fff;
      }
      #pz {
        display: none;
        position: absolute;
        top: 8px;
        right: 14px;
        padding: 0.2em 0.7em;
        font-size: 18px;
        opacity: 0.85;
      }
      #pad {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(8px + env(safe-area-inset-bottom));
        justify-content: space-between;
        padding: 0 16px;
        pointer-events: none;
      }
      #pad button {
        pointer-events: auto;
        touch-action: none;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 2px solid #667;
        background: #1a2030b0;
        color: #fff;
        font-size: 26px;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="c" width="960" height="540"></canvas
      ><button id="pz" aria-label="Pause">❚❚</button>
      <div id="ov">
        <div id="msg"></div>
        <div id="bt"><button id="b1"></button><button id="b2" class="alt"></button></div>
      </div>
    </div>
    <div id="pad">
      <div><button data-k="left">◀</button> <button data-k="right">▶</button></div>
      <button data-k="jump">▲</button>
    </div>
    <script>
      "use strict";
      // No audio starts before a user gesture (Start/Play button), so autoplay rules never silence the game.
      const W = 960,
        H = 540,
        DT = 1000 / 60,
        GY = 0.5,
        JV = -9.6,
        SP = 3.2;
      const $ = (id) => document.getElementById(id);
      const RNG = {
        make(a) {
          return () => {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        },
      };
      const runSeed =
        +new URLSearchParams(location.search).get("seed") | 0 || Date.now() & 0xffffff; // ?seed=123 reproduces timings
      console.info("seed", runSeed);

      // ---- Save: versioned + validated; fake doors/traps never touch it ----
      const Save = (() => {
        const K = "youthought.save",
          ok = (o) =>
            o &&
            typeof o === "object" &&
            o.v === 1 &&
            Number.isInteger(o.hi) &&
            o.hi >= 0 &&
            o.hi <= 9 &&
            Number.isInteger(o.done) &&
            o.done >= 0 &&
            o.done < 1024 &&
            Number.isInteger(o.deaths) &&
            o.deaths >= 0 &&
            o.deaths < 1e7 &&
            typeof o.vol === "number" &&
            o.vol >= 0 &&
            o.vol <= 1 &&
            typeof o.mute === "boolean";
        let d = { v: 1, hi: 0, done: 0, deaths: 0, vol: 0.5, mute: false };
        try {
          const o = JSON.parse(localStorage.getItem(K));
          if (ok(o)) d = o;
        } catch (e) {}
        return {
          d,
          w() {
            try {
              if (ok(d)) localStorage.setItem(K, JSON.stringify(d));
            } catch (e) {}
          },
          reset() {
            d.hi = 0;
            d.done = 0;
            d.deaths = 0;
            this.w();
          },
        };
      })();

      // ---- Audio: procedural 20 s loop (every note fades to 0 before the loop point = seamless) ----
      const Snd = (() => {
        let ctx, gain, src;
        function init() {
          if (ctx) return true;
          try {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
            gain = ctx.createGain();
            gain.connect(ctx.destination);
            vol();
            return true;
          } catch (e) {
            return false;
          }
        }
        function vol() {
          if (gain) gain.gain.value = Save.d.mute ? 0 : Save.d.vol * 0.4;
        }
        function buf(root) {
          const sr = 22050,
            b = ctx.createBuffer(1, 20 * sr, sr),
            d = b.getChannelData(0),
            sc = [0, 3, 5, 7, 10, 7, 5, 3];
          for (let s = 0; s < 40; s++) {
            const f = root * Math.pow(2, sc[(s * 3 + (s >> 3)) % 8] / 12),
              i0 = ((s * sr) / 2) | 0;
            for (let i = 0; i < sr / 2; i++) {
              const t = i / (sr / 2),
                e = (1 - t) * (1 - t);
              d[i0 + i] +=
                Math.sin((6.2832 * f * i) / sr) * e * 0.25 +
                (s % 4 === 0 ? Math.sin((3.1416 * f * i) / sr) * e * 0.3 : 0);
            }
          }
          return b;
        }
        return {
          vol,
          music(l) {
            if (!init()) return;
            this.stop();
            try {
              if (ctx.state === "suspended") ctx.resume();
              src = ctx.createBufferSource();
              src.buffer = buf(110 * Math.pow(2, ((l * 2) % 12) / 12));
              src.loop = true;
              src.connect(gain);
              src.start();
            } catch (e) {}
          },
          stop() {
            try {
              if (src) {
                src.stop();
                src = null;
              }
            } catch (e) {}
          },
          sfx(f, t) {
            if (!ctx || Save.d.mute) return;
            try {
              const o = ctx.createOscillator(),
                g2 = ctx.createGain();
              o.frequency.value = f;
              g2.gain.value = 0.05 * Save.d.vol;
              o.connect(g2);
              g2.connect(ctx.destination);
              o.start();
              o.stop(ctx.currentTime + t);
            } catch (e) {}
          },
        };
      })();

      // ---- Input ----
      const Input = (() => {
        const s = { left: false, right: false, jump: false },
          map = {
            ArrowLeft: "left",
            a: "left",
            A: "left",
            ArrowRight: "right",
            d: "right",
            D: "right",
            ArrowUp: "jump",
            w: "jump",
            W: "jump",
            " ": "jump",
          };
        const rel = () => {
          s.left = s.right = s.jump = false;
        };
        addEventListener("keydown", (e) => {
          if (map[e.key]) {
            s[map[e.key]] = true;
            e.preventDefault();
          }
          if (e.repeat) return;
          if (e.key === "Enter") Game.act();
          else if (e.key === "r" || e.key === "R") {
            if (Game.state() === "dead") Game.act();
          } else if (e.key === "m" || e.key === "M") Game.mute();
          else if (e.key === "p" || e.key === "P" || e.key === "Escape") window.__handleBack();
        });
        addEventListener("keyup", (e) => {
          if (map[e.key]) s[map[e.key]] = false;
        });
        addEventListener("blur", rel);
        addEventListener("contextmenu", (e) => e.preventDefault());
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            rel();
            Game.autoPause();
          }
        });
        document.querySelectorAll("#pad button").forEach((b) => {
          const k = b.dataset.k;
          b.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            s[k] = true;
          });
          ["pointerup", "pointercancel", "pointerleave"].forEach((t) =>
            b.addEventListener(t, () => {
              s[k] = false;
            }),
          );
        });
        if ("ontouchstart" in window || navigator.maxTouchPoints > 0)
          $("pad").style.display = "flex";
        return { s };
      })();

      // ---- Object model: every trap owns its state machine; no global trap timer ----
      const mk = (t, a) =>
        Object.assign(
          {
            t,
            sx: 0,
            sy: 0,
            sw: 0,
            sh: 0,
            lx: 0,
            ly: 0,
            lw: 0,
            lh: 0,
            st: 0,
            ad: 0,
            cd: 0,
            tm: 0,
            h: 0,
            len: 0,
          },
          a,
        );
      const F = (x, y, w) => mk("F", { x, y, w, sx: x, sy: y, sw: w, sh: H - y });
      const B = (x, w, h) => mk("B", { x, y: 0, w, h, sx: x, sy: 0, sw: w, sh: h });
      const K = (x, y, w) => mk("K", { x, y, w, lx: x, ly: y, lw: w, lh: H - y });
      const C = (x, y, w, m, d, link, id) =>
        mk("C", {
          x,
          y,
          w,
          m,
          d,
          link,
          id,
          sx: x,
          sy: y,
          sw: w,
          sh: 16,
          vy: 0,
          mo: 0,
          ms: 0,
          dir: 1,
          dist: 0,
          sl: 0,
          rs: 1,
          lead: 30,
        });
      const G = (x, y, w, m, o) => mk("G", { x, y, w, m, rad: 70, dur: 60, per: 150, ...o });
      const S = (x, y, w, m, o) =>
        mk("S", { x, y, w, m, rad: 60, sp: 5, max: 150, dur: 60, per: 180, d: 15, ...o });
      const Pf = (x, y, w, o) =>
        mk("P", { x, y, w, fy: y + 110, sp: 1.3, d: 15, at: 60, ld: 5, ...o });
      const Wl = (x, y, w, h, m, o) =>
        mk("W", {
          x,
          y,
          w,
          h,
          m,
          sx: x,
          sy: y,
          sw: w,
          sh: h,
          pos: 0,
          v: 2,
          dist: 150,
          rg: 100,
          d: 20,
          dx: 0,
          ...o,
        });
      const D = (id, x, y, o) =>
        mk("D", { id, x, y, hx: x, w: 30, h: 46, sx: x, sy: y - 46, n: 0, real: 1, ...o });
      let objs = [],
        byId = {},
        pl = {
          x: 40,
          y: 414,
          vx: 0,
          vy: 0,
          c: 0,
          b: 0,
          stand: null,
          ls: null,
          j: false,
          f: 1,
          t: 0,
          s: "idle",
          lt: 0,
        },
        tick = 0,
        colTick = -999;
      function trig(o, d) {
        if (o && o.st === 0 && o.ad === 0 && !(o.cd > 0)) o.ad = Math.max(1, d | 0);
      }
      const ovr = (a, b, c, d, e, f, g_, h) => a < e + g_ && a + c > e && b < f + h && b + d > f;
      function pushOut(o) {
        if (pl.x + 7 < o.sx + o.sw / 2) pl.x = o.sx - 14;
        else pl.x = o.sx + o.sw;
        pl.x = Math.max(10, Math.min(W - 24, pl.x));
        pl.s = "hit";
      }
      const near = (o) => Math.abs(pl.x + 7 - (o.x + o.w / 2));

      // Each panel/pit owns its own random stream, so no two behave in sync.
      function nextRand(o) {
        o.rs = (Math.imul(o.rs, 1664525) + 1013904223) >>> 0;
        return o.rs / 4294967296;
      }
      const U = {
        C(o) {
          if (o.st === 0) {
            if (pl.stand === o && o.m !== "safe" && o.m !== "take") trig(o, o.d);
            if (o.m === "take" && pl.j && pl.ls === o) trig(o, 3);
            // Surprise pit: opens a few steps before the edge, with no warning shake.
            if (o.m === "pit" && pl.stand && pl.x + 7 > o.x - o.lead)
              trig(o, 2 + ((nextRand(o) * 4) | 0));
          }
          // Sliding panel: may shift sideways when the player jumps toward it, then returns.
          if (o.sl && o.st === 0) {
            const prev = o.mo;
            if (o.ms === 0) {
              if (
                pl.j &&
                pl.stand !== o &&
                Math.abs(pl.x + 7 - (o.x + o.mo + o.w / 2)) < 170 &&
                nextRand(o) < 0.6
              ) {
                o.ms = 1;
                o.dir = nextRand(o) < 0.5 ? -1 : 1;
                o.dist = 30 + nextRand(o) * 15;
              }
            } else if (o.ms === 1) {
              o.mo += o.dir * 2.2;
              if (Math.abs(o.mo) >= o.dist) {
                o.ms = 2;
                o.tm = (45 + nextRand(o) * 25) | 0;
              }
            } else if (o.ms === 2) {
              if (--o.tm <= 0) o.ms = 3;
            } else {
              o.mo -= Math.sign(o.mo) * 1.5;
              if (Math.abs(o.mo) < 1.5) {
                o.mo = 0;
                o.ms = 0;
              }
            }
            if (pl.stand === o) pl.x += o.mo - prev; // panel carries the player
          }
          if (o.ad > 0 && --o.ad === 0) {
            colTick = tick;
            Snd.sfx(150, 0.12);
            if (o.link) trig(byId[o.link], 24);
            if (o.m === "part") {
              o.sx = o.x + o.w / 2;
              o.sw = o.w / 2;
              o.st = 4;
            } else if (o.m === "pit") {
              o.sw = 0;
              o.st = 3;
              o.cd = 1e9;
            } else {
              o.st = 2;
              o.vy = 0;
            }
          }
          if (o.st === 2) {
            o.vy += 0.5;
            o.sy += o.vy;
            o.sw = 0;
            if (o.sy > H + 40) {
              o.st = 3;
              o.cd = o.m === "repeat" ? 150 : 1e9;
            }
          }
          if (o.st === 3 && --o.cd <= 0) {
            o.st = 0;
            o.sy = o.y;
            o.sw = o.w;
            o.sx = o.x;
          }
          if (o.st !== 4) o.sx = o.x + o.mo;
        },
        G(o) {
          if (o.st === 0) {
            if (o.m === "prox" && near(o) < o.rad && pl.stand) trig(o, o.d);
            else if (o.m === "jump" && pl.j && near(o) < o.rad) trig(o, o.d);
            else if (o.m === "timer" && --o.tm <= 0) {
              o.tm = o.per;
              trig(o, 18);
            }
          }
          if (o.ad > 0 && --o.ad === 0) {
            o.st = 1;
            Snd.sfx(700, 0.05);
          }
          if (o.st === 1) {
            o.h += 3;
            if (o.h >= 20) {
              o.h = 20;
              o.st = 2;
              o.t2 = o.dur;
            }
          } else if (o.st === 2 && --o.t2 <= 0) o.st = 3;
          else if (o.st === 3) {
            o.h -= 1.5;
            if (o.h <= 0) {
              o.h = 0;
              o.st = 0;
              if (o.m !== "timer") o.cd = 90;
            }
          }
          if (o.cd > 0 && o.st === 0) o.cd--;
          o.lx = o.x;
          o.ly = o.y - o.h;
          o.lw = o.h > 2 ? o.w : 0;
          o.lh = o.h;
        },
        S(o) {
          if (o.st === 0) {
            if (o.m === "prox" && near(o) < o.rad) trig(o, o.d);
            else if (o.m === "jump" && pl.j && near(o) < o.rad + 40) trig(o, o.d);
            else if (o.m === "timer" && --o.tm <= 0) {
              o.tm = o.per;
              trig(o, 20);
            }
          }
          if (o.ad > 0 && --o.ad === 0) o.st = 1;
          if (o.st === 1) {
            o.len += o.sp;
            if (o.len >= o.max) {
              o.len = o.max;
              o.st = 2;
              o.t2 = o.dur;
            }
          } else if (o.st === 2 && --o.t2 <= 0) o.st = 3;
          else if (o.st === 3) {
            o.len -= 1.5;
            if (o.len <= 0) {
              o.len = 0;
              o.st = 0;
              o.cd = 90;
            }
          }
          if (o.cd > 0 && o.st === 0) o.cd--;
          o.lx = o.x;
          o.ly = o.y;
          o.lw = o.len > 6 ? o.w : 0;
          o.lh = o.len;
        },
        P(o) {
          if (o.st === 0 && pl.stand && pl.x + 7 > o.x - 110 && pl.x < o.x) trig(o, o.d);
          if (o.ad > 0 && --o.ad === 0) o.st = 1;
          if (o.st === 1) {
            o.fy -= o.sp;
            if (o.link && !o.fired && o.y + 110 - o.fy >= o.at) {
              o.fired = 1;
              trig(byId[o.link], o.ld);
            }
            if (o.fy <= o.y) {
              o.fy = o.y;
              o.st = 2;
            }
          }
          o.sx = o.x;
          o.sy = o.fy;
          o.sw = o.st ? o.w : 0;
          o.sh = H - o.fy;
          if (o.sw && ovr(pl.x, pl.y, 14, 26, o.sx, o.sy, o.sw, o.sh)) {
            pl.y = o.sy - 26;
            pl.vy = 0;
            pl.stand = o;
          }
        }, // rising floor lifts the player, never traps them
        W(o) {
          const ox = o.sx,
            oy = o.sy;
          if (o.m === "push") {
            if (o.st === 0 && pl.x > o.tx) trig(o, o.d);
            if (o.ad > 0 && --o.ad === 0) o.st = 1;
            if (o.st === 1) {
              o.pos += o.v / Math.abs(o.dist);
              if (o.pos >= 1) {
                o.pos = 1;
                o.st = 2;
                o.t2 = 40;
              }
            } else if (o.st === 2 && --o.t2 <= 0) o.st = 3;
            else if (o.st === 3) {
              o.pos -= 0.004;
              if (o.pos <= 0) {
                o.pos = 0;
                o.st = 5;
              }
            }
            o.sx = o.x + o.dist * o.pos;
          } else if (o.m === "osc") {
            o.ph += o.v;
            o.sx = o.x + Math.sin(o.ph) * o.amp;
          } else if (o.m === "false") {
            if (o.st === 0 && pl.x > o.x - o.rg) {
              o.st = 1;
              trig(byId[o.link], 10);
            }
            if (o.st === 1) {
              o.sy -= 3;
              if (o.sy <= o.y - o.h - 6) o.st = 2;
            }
          } else if (o.m === "appear") {
            if (o.st === 0 && pl.x > o.tx) trig(o, o.d);
            if (o.ad > 0 && --o.ad === 0) o.st = 1;
            if (o.st === 1) {
              o.tm++;
              if (o.tm > 25 && !ovr(pl.x - 4, pl.y, 22, 26, o.x, o.sy, o.w, o.h)) {
                o.st = 2;
                o.sw = o.w;
                Snd.sfx(110, 0.15);
              }
            }
          }
          o.dx = o.sx - ox;
          if (o.sw && o.dx && ovr(pl.x, pl.y, 14, 26, o.sx, o.sy, o.sw, o.sh)) pushOut(o);
        },
        D(o) {
          if (o.dead) return;
          if (o.real) {
            if (o.st === 0 && o.n > 0 && pl.x < o.x && o.x - pl.x < 120 && pl.stand) {
              o.n--;
              o.st = 1;
              Snd.sfx(220, 0.1);
            }
            if (o.st === 1) {
              o.x += 3;
              if (o.x >= Math.min(o.hx + 110, 925)) {
                o.st = 2;
                o.tm = o.hold;
              }
            } else if (o.st === 2 && --o.tm <= 0) o.st = 3;
            else if (o.st === 3) {
              o.x -= 2;
              if (o.x <= o.hx) {
                o.x = o.hx;
                o.st = 0;
              }
            }
          }
          o.sx = o.x;
          o.sw = o.st ? o.w : 0;
          if (o.sw && ovr(pl.x, pl.y, 14, 26, o.sx, o.sy, o.sw, o.h)) pushOut(o);
          if (ovr(pl.x, pl.y, 14, 26, o.x, o.sy, o.w, o.h)) {
            if (o.real) {
              if (o.st === 0) Game.complete(o);
            } else {
              o.dead = 1;
              o.sw = 0;
              trig(byId[o.link], 4);
            }
          }
        },
      };

      // ---- Levels: hand-made layouts, randomized timings (bounded) ----
      const LV = [
        {
          name: "WELCOME",
          bg: "#cfe8ff",
          wl: "#59708f",
          fl: "#2b3a52",
          ce: 90,
          mk: (R) => [
            F(0, 440, 360),
            F(450, 440, 510),
            G(560, 440, 44, "prox", { d: R(14, 26) }),
            D("d", 760, 440, { n: 1, hold: R(60, 100) }),
          ],
        },
        {
          name: "FLOATING",
          bg: "#2a1a14",
          wl: "#a0623a",
          fl: "#c98a52",
          ce: 60,
          mk: (R) => {
            const SL = (o) => {
              o.sl = 1;
              o.rs = R(1, 1e9) | 0;
              return o;
            };
            const pit = C(110, 440, 50, "pit", 0);
            pit.rs = R(1, 1e9) | 0;
            return [
              K(110, 500, 530),
              F(0, 440, 110),
              pit,
              F(160, 440, 40),
              SL(C(210, 400, 50, "land", R(10, 22))),
              SL(C(330, 350, 50, "delay", R(35, 60))),
              SL(C(450, 300, 50, "safe", 0)),
              SL(C(570, 350, 50, "take", 0)),
              F(640, 330, 320),
              S(700, 60, 60, "prox", { d: R(20, 35), max: 180 }),
              D("d", 780, 330, { hold: R(60, 90) }),
            ];
          },
        },
        {
          name: "PILLARS",
          bg: "#b9a7e6",
          wl: "#6f5fb0",
          fl: "#4a7a56",
          ce: 70,
          mk: (R) => [
            F(0, 400, 120),
            F(200, 400, 56),
            C(336, 400, 56, "delay", R(25, 45)),
            F(456, 400, 56),
            C(592, 400, 56, "take", 0),
            F(728, 400, 232),
            S(395, 70, 50, "jump", { d: R(5, 12), max: 230 }),
            G(740, 400, 36, "timer", { tm: R(60, 140), per: R(130, 200), dur: 50 }),
            D("d", 800, 400, { n: 2, hold: R(60, 100) }),
          ],
        },
        {
          name: "THE TUNNEL",
          bg: "#f2c58a",
          wl: "#d98a2e",
          fl: "#7a3f12",
          ce: 100,
          mk: (R) => [
            F(0, 440, 560),
            B(300, 260, 360),
            S(380, 360, 70, "timer", {
              tm: R(30, 80),
              per: R(160, 220),
              sp: 2.2,
              max: 62,
              dur: 50,
            }),
            Wl(10, 340, 18, 100, "push", { tx: 200, dist: 330, v: 1.9, d: R(10, 30) }),
            C(560, 440, 70, "chain", R(20, 26), "c2", "c1"),
            C(630, 440, 70, "chain", R(20, 26), "c3", "c2"),
            C(700, 440, 70, "delay", R(20, 30), null, "c3"),
            F(770, 440, 190),
            D("d", 800, 440, { n: 1, hold: R(60, 90) }),
            D("f", 860, 440, { real: 0, link: "s2" }),
            S(850, 100, 60, "link", { sp: 7, max: 340, id: "s2" }),
          ],
        },
        {
          name: "NOT AGAIN",
          bg: "#1a1d2b",
          wl: "#3b4262",
          fl: "#8b93b8",
          ce: 60,
          mk: (R) => {
            const a = R(60, 120),
              b = R(150, 190);
            return [
              F(0, 440, 180),
              Pf(180, 440, 130, { d: R(10, 20), link: "s1", at: 70, ld: R(0, 10) }),
              S(190, 60, 120, "link", { sp: 4, max: 300, id: "s1" }),
              F(310, 440, 130),
              C(440, 440, 120, "part", R(20, 30)),
              C(560, 440, 100, "delay", R(40, 55)),
              F(660, 440, 300),
              G(690, 440, 50, "timer", { tm: a, per: b, dur: 50 }),
              S(690, 60, 60, "timer", { tm: a, per: b, sp: 5, max: 300, dur: 50 }),
              Wl(770, 340, 16, 100, "false", { rg: 100, link: "g2" }),
              G(790, 440, 50, "link", { id: "g2", dur: 60 }),
              D("d", 840, 440, { n: 2, hold: R(60, 100) }),
            ];
          },
        },
      ];
      function validate(objs) {
        const sup = objs
          .filter((o) => o.t === "F" || o.t === "C" || o.t === "P")
          .sort((a, b) => a.x - b.x);
        for (let i = 1; i < sup.length; i++) {
          const c = sup[i - 1],
            n = sup[i];
          if (n.x - (c.x + c.w) > 96) return "gap too wide";
          if (c.y - n.y > 64) return "step too high";
        }
        const ds = objs.filter((o) => o.t === "D" && o.real);
        if (ds.length !== 1 || ds[0].hx + 30 > W - 10) return "bad exit door";
        if (
          objs.some(
            (o) => (o.t === "G" || o.t === "S" || o.t === "K") && o.x < 80 && o.x + o.w > 20,
          )
        )
          return "trap on spawn";
        return "";
      }

      // ---- Game: state machine ----
      const TA = {
        fall: ["Wrong platform.", "Gravity wins again.", "Almost."],
        floor: ["Why did the floor disappear?", "That floor was a lie.", "Wrong platform."],
        spike: ["Skill issue.", "That was unfortunate.", "Interesting decision."],
        wall: ["Not a bug.", "The wall had plans.", "Nice try."],
        door: ["I was literally at the door.", "You thought."],
        gen: ["You thought.", "One more try?", "Surely you'll get it this time.", "Welcome back."],
      };
      const Game = (() => {
        const cv = $("c"),
          g = cv.getContext("2d"),
          ov = $("ov");
        let state = "title",
          cur = 0,
          att = 0,
          done = false,
          pj = false,
          lastAct = 0,
          err = "";
        const L = () => LV[cur];
        function show(st, c) {
          state = st;
          ov.style.display = st === "play" ? "none" : "block";
          $("pz").style.display = st === "play" ? "block" : "none";
          const m = $("msg");
          m.className = "";
          $("b2").style.display = "none";
          const b1 = $("b1");
          if (st === "title") {
            m.innerHTML =
              '<div style="font-size:clamp(34px,8vw,84px);font-weight:700">YOU THOUGHT.</div><div style="font-size:clamp(14px,2.4vw,24px);margin-top:10px;font-weight:400">A tiny, innocent platformer.<br>Just jump, dodge, and reach the finish line.<br>How hard could it possibly be?</div>';
            b1.textContent = Save.d.hi > 0 ? "Continue" : "Play";
            if (Save.d.hi > 0 || Save.d.deaths > 0) {
              $("b2").style.display = "";
              $("b2").textContent = "Start over";
            }
          } else if (st === "prep") {
            m.innerHTML =
              "Level " +
              (cur + 1) +
              '<br><span style="font-size:.6em;font-weight:400">' +
              L().name +
              "</span>";
            b1.textContent = "Start";
          } else if (st === "dead") {
            m.className = "big";
            m.textContent = c;
            b1.textContent = "Restart";
          } else if (st === "paused") {
            m.innerHTML =
              'Paused<br><input id="vl" type="range" min="0" max="1" step=".05" style="width:50%">';
            $("vl").value = Save.d.vol;
            $("vl").oninput = (e) => {
              Save.d.vol = +e.target.value;
              Snd.vol();
              Save.w();
            };
            b1.textContent = "Resume";
          } else if (st === "complete") {
            m.textContent = "Level complete";
            b1.textContent = "Continue";
          } else if (st === "victory") {
            m.innerHTML =
              'You made it.<br><span style="font-size:.6em;font-weight:400">Deaths: ' +
              Save.d.deaths +
              "</span>";
            b1.textContent = "Back to title";
          } else if (st === "error") {
            m.textContent = "Level refused to start: " + c;
            b1.textContent = "Back";
          }
        }
        function load(i) {
          cur = i;
          att++;
          done = false;
          const r = RNG.make(runSeed ^ (i * 7919) ^ (att * 104729)),
            R = (a, b) => a + r() * (b - a);
          objs = L().mk(R);
          byId = {};
          for (const o of objs) if (o.id) byId[o.id] = o;
          const e = validate(objs);
          if (e) {
            objs = [];
            show("error", e);
            return;
          }
          Object.assign(pl, {
            x: 40,
            y: 414,
            vx: 0,
            vy: 0,
            c: 0,
            b: 0,
            stand: null,
            ls: null,
            j: false,
            f: 1,
            t: 0,
            s: "idle",
            lt: 0,
          });
          tick = 0;
          pj = false;
          Snd.stop();
          show("prep");
        }
        function kill(c) {
          if (state !== "play") return;
          Save.d.deaths++;
          Save.w();
          pl.s = "die";
          Snd.stop();
          Snd.sfx(90, 0.3);
          const r = Math.random();
          let k = c === "fall" && tick - colTick < 90 ? "floor" : c;
          let pool = r < 0.3 ? TA.gen : TA[k] || TA.gen;
          show("dead", pool[(Math.random() * pool.length) | 0]);
        }
        function complete(o) {
          // only the real door, stationary, once per level, never right at spawn
          if (state !== "play" || done || !o.real || o.st !== 0 || tick < 20 || o.dead) return;
          done = true;
          Save.d.done |= 1 << cur;
          Save.d.hi = Math.max(Save.d.hi, Math.min(cur + 1, LV.length - 1));
          Save.w();
          pl.s = "celebrate";
          Snd.stop();
          Snd.sfx(880, 0.2);
          show("complete");
        }
        function step() {
          tick++;
          pl.t++;
          const s = Input.s,
            je = s.jump && !pj;
          pj = s.jump;
          if (je) pl.b = 7;
          pl.j = false;
          if (pl.lt > 0) pl.lt--;
          const tv = ((s.right ? 1 : 0) - (s.left ? 1 : 0)) * SP;
          pl.vx += Math.max(-0.7, Math.min(0.7, tv - pl.vx));
          if (tv) pl.f = tv > 0 ? 1 : -1;
          if (pl.b > 0) pl.b--;
          if (pl.b > 0 && pl.c > 0) {
            pl.vy = JV;
            pl.b = 0;
            pl.c = 0;
            pl.j = true;
            pl.ls = pl.stand;
            pl.stand = null;
            Snd.sfx(520, 0.07);
          }
          if (!s.jump && pl.vy < -4) pl.vy = -4;
          for (let i = 0; i < objs.length; i++) {
            const f = U[objs[i].t];
            if (f) f(objs[i]);
          }
          pl.x = Math.max(10, Math.min(W - 24, pl.x + pl.vx));
          for (let i = 0; i < objs.length; i++) {
            const o = objs[i];
            if (o.sw > 0 && pl.vx && ovr(pl.x, pl.y, 14, 26, o.sx, o.sy, o.sw, o.sh)) {
              pl.x = pl.vx > 0 ? o.sx - 14 : o.sx + o.sw;
              pl.vx = 0;
            }
          }
          const pb = pl.y + 26,
            pt = pl.y,
            was = pl.stand;
          pl.vy = Math.min(11, pl.vy + GY);
          pl.y += pl.vy;
          pl.stand = null;
          for (let i = 0; i < objs.length; i++) {
            const o = objs[i];
            if (o.sw > 0 && ovr(pl.x, pl.y, 14, 26, o.sx, o.sy, o.sw, o.sh)) {
              if (pl.vy >= 0 && pb <= o.sy + 0.01) {
                pl.y = o.sy - 26;
                pl.vy = 0;
                pl.stand = o;
              } else if (pl.vy < 0 && pt >= o.sy + o.sh - 0.01) {
                pl.y = o.sy + o.sh;
                pl.vy = 0;
              } else {
                pl.x = pl.x + 7 < o.sx + o.sw / 2 ? o.sx - 14 : o.sx + o.sw;
              }
            }
          }
          if (pl.stand) {
            pl.c = 6;
            if (!was) {
              pl.lt = 6;
            }
          } else if (pl.c > 0) pl.c--;
          pl.s = pl.stand
            ? pl.lt > 0
              ? "land"
              : Math.abs(pl.vx) > 2.6
                ? "run"
                : Math.abs(pl.vx) > 0.5
                  ? "walk"
                  : "idle"
            : pl.vy < 0
              ? "jump"
              : "fall";
          for (let i = 0; i < objs.length; i++) {
            const o = objs[i];
            if (
              o.sw > 0 &&
              o.t === "W" &&
              ovr(pl.x + 1, pl.y + 1, 12, 24, o.sx, o.sy, o.sw, o.sh)
            ) {
              kill("wall");
              return;
            }
          } // crushed between wall and solid: a fair death, never a stuck state
          for (let i = 0; i < objs.length; i++) {
            const o = objs[i];
            if (o.lw > 0 && ovr(pl.x + 2, pl.y + 2, 10, 22, o.lx, o.ly, o.lw, o.lh)) {
              kill("spike");
              return;
            }
          }
          if (pl.y > H + 10) kill("fall");
        }
        function drawPl() {
          g.save();
          g.translate(pl.x + 7, pl.y + 13);
          g.scale(pl.f, 1);
          g.fillStyle = g.strokeStyle = "#111";
          g.lineWidth = 3;
          g.lineCap = "round";
          const st = pl.s,
            t = pl.t;
          if (st === "die") g.rotate(1.5);
          if (st === "land") g.scale(1.12, 0.88);
          g.beginPath();
          g.arc(0, -8, 5, 0, 6.3);
          g.fill();
          g.fillRect(-3, -3, 6, 10);
          const sw =
            st === "walk" ? Math.sin(t * 0.35) * 5 : st === "run" ? Math.sin(t * 0.5) * 8 : 0;
          g.beginPath();
          if (st === "jump") {
            g.moveTo(0, 7);
            g.lineTo(-5, 12);
            g.moveTo(0, 7);
            g.lineTo(5, 10);
            g.moveTo(0, -1);
            g.lineTo(-6, -7);
            g.moveTo(0, -1);
            g.lineTo(6, -6);
          } else if (st === "fall") {
            g.moveTo(0, 7);
            g.lineTo(-4, 13);
            g.moveTo(0, 7);
            g.lineTo(4, 13);
            g.moveTo(0, -1);
            g.lineTo(-7, -4);
            g.moveTo(0, -1);
            g.lineTo(7, -4);
          } else if (st === "celebrate") {
            g.moveTo(0, 7);
            g.lineTo(-3, 13);
            g.moveTo(0, 7);
            g.lineTo(3, 13);
            g.moveTo(0, -1);
            g.lineTo(-6, -10);
            g.moveTo(0, -1);
            g.lineTo(6, -10);
          } else {
            g.moveTo(0, 7);
            g.lineTo(-sw, 13);
            g.moveTo(0, 7);
            g.lineTo(sw, 13);
            g.moveTo(0, -1);
            g.lineTo(sw * 0.6, 5);
            g.moveTo(0, -1);
            g.lineTo(-sw * 0.6, 5);
          }
          g.stroke();
          if (st === "hit") {
            g.fillStyle = "#e33";
            g.beginPath();
            g.arc(0, -8, 2, 0, 6.3);
            g.fill();
          }
          g.restore();
        }
        function spikes(x, y, w, h, dir) {
          g.beginPath();
          for (let a = x; a < x + w - 1; a += 11) {
            g.moveTo(a, y);
            g.lineTo(a + 5.5, y + dir * h);
            g.lineTo(a + 11, y);
          }
          g.fill();
        }
        function drawObj(o, l) {
          switch (o.t) {
            case "F":
              g.fillStyle = l.fl;
              g.fillRect(o.x, o.y, o.w, H - o.y);
              g.fillStyle = "rgba(255,255,255,.2)";
              g.fillRect(o.x, o.y, o.w, 3);
              break;
            case "B":
              g.fillStyle = l.wl;
              g.fillRect(o.x, 0, o.w, o.h);
              break;
            case "K":
              g.fillStyle = "#d33";
              spikes(o.x, H, o.lw, H - o.y, -1);
              break;
            case "P":
              g.fillStyle = "#05070b";
              g.fillRect(o.x, o.y, o.w, H - o.y);
              if (o.st) {
                g.fillStyle = l.fl;
                g.fillRect(o.x, o.fy, o.w, H - o.fy);
                g.fillStyle = "rgba(255,255,255,.2)";
                g.fillRect(o.x, o.fy, o.w, 3);
              }
              break;
            case "C":
              if (o.st === 3) break;
              {
                const j = o.ad > 0 && o.m !== "pit" ? (tick % 4 < 2 ? 1.5 : -1.5) : 0;
                const px = o.x + o.mo;
                g.fillStyle = l.fl;
                const x = o.st === 4 ? o.x + o.w / 2 : px,
                  w = o.st === 4 ? o.w / 2 : o.w;
                g.fillRect(x + j, o.sy, w, o.m === "pit" ? H - o.sy : 16);
                g.fillStyle = "rgba(255,255,255,.2)";
                g.fillRect(x + j, o.sy, w, 3);
                if (o.m === "safe") {
                  g.strokeStyle = "rgba(0,0,0,.5)";
                  g.beginPath();
                  g.moveTo(px + 12, o.sy);
                  g.lineTo(px + 20, o.sy + 16);
                  g.moveTo(px + 34, o.sy);
                  g.lineTo(px + 28, o.sy + 16);
                  g.stroke();
                }
              }
              break;
            case "G":
              if (o.ad > 0) {
                // only a brief tremble once armed; idle spike spots are invisible
                g.fillStyle = "#111";
                g.fillRect(o.x + (tick % 4 < 2 ? 1 : 0), o.y, o.w, 2);
              }
              if (o.h > 0) {
                g.fillStyle = "#e22";
                spikes(o.x, o.y, o.w, o.h, -1);
              }
              break;
            case "S":
              if (o.ad > 0) {
                g.fillStyle = "#111";
                g.fillRect(o.x, o.y, o.w, tick % 4 < 2 ? 4 : 2);
              }
              if (o.len > 0) {
                g.fillStyle = "#777";
                g.fillRect(o.x + o.w / 2 - 3, o.y, 6, o.len);
                g.fillStyle = "#e22";
                spikes(o.x, o.y + o.len - 14, o.w, 14, 1);
              }
              break;
            case "W":
              if (o.sw > 0 || (o.st === 1 && o.m === "appear")) {
                g.fillStyle =
                  o.sw > 0 ? "#1d2433" : "rgba(29,36,51," + (tick % 6 < 3 ? 0.5 : 0.15) + ")";
                g.fillRect(o.sx, o.sy, o.w, o.h);
              }
              break;
            case "D":
              if (o.dead) break;
              g.fillStyle = "#e8e6df";
              g.fillRect(o.x, o.sy, o.w, o.h);
              g.strokeStyle = "#555";
              g.lineWidth = 2;
              g.strokeRect(o.x, o.sy, o.w, o.h);
              g.fillStyle = "#555";
              g.fillRect(o.x + o.w - 8, o.sy + 24, 3, 3);
          }
        }
        function draw() {
          const l = L();
          g.fillStyle = l.bg;
          g.fillRect(0, 0, W, H);
          g.fillStyle = l.wl;
          g.fillRect(0, 0, W, l.ce);
          g.fillRect(0, 0, 10, H);
          g.fillRect(W - 10, 0, 10, H);
          for (let i = 0; i < objs.length; i++) drawObj(objs[i], l);
          if (objs.length) drawPl();
          g.fillStyle = "#fff";
          g.font = "bold 16px system-ui";
          g.fillText(
            "LEVEL " +
              (cur + 1) +
              "   DEATHS " +
              Save.d.deaths +
              "   SOUND " +
              (Save.d.mute ? "OFF" : "ON"),
            18,
            30,
          );
        }
        function size() {
          const vw = window.visualViewport ? visualViewport.width : innerWidth,
            vh = window.visualViewport ? visualViewport.height : innerHeight,
            w = Math.min(vw, (vh * 16) / 9),
            e = $("wrap");
          e.style.width = w + "px";
          e.style.height = (w * 9) / 16 + "px";
        }
        addEventListener("resize", size);
        if (window.visualViewport) visualViewport.addEventListener("resize", size);
        size();
        let last = performance.now(),
          acc = 0;
        function frame(n) {
          const d = Math.min(n - last, 100);
          last = n;
          if (state === "play") {
            acc += d;
            while (acc >= DT && state === "play") {
              step();
              acc -= DT;
            }
          } else acc = 0;
          draw();
          requestAnimationFrame(frame);
        }
        function act() {
          const n = performance.now();
          if (n - lastAct < 250) return;
          lastAct = n; // one press = one action, never double-fires
          if (state === "title") load(Math.min(Save.d.hi, LV.length - 1));
          else if (state === "prep") {
            state = "play";
            show("play");
            Snd.music(cur);
          } else if (state === "dead") load(cur);
          else if (state === "paused") {
            show("play");
            Snd.music(cur);
          } else if (state === "complete") {
            if (cur >= LV.length - 1) {
              show("victory");
            } else load(cur + 1);
          } else if (state === "victory" || state === "error") show("title");
        }
        function pause() {
          if (state === "play") {
            Snd.stop();
            show("paused");
          }
        }
        $("b1").addEventListener("click", act);
        $("pz").addEventListener("click", pause);
        $("b2").addEventListener("click", () => {
          Save.reset();
          show("title");
        });
        show("title");
        requestAnimationFrame(frame);
        return {
          act,
          complete,
          state: () => state,
          autoPause: pause,
          mute() {
            Save.d.mute = !Save.d.mute;
            Save.w();
            Snd.vol();
          },
          pause,
        };
      })();
      // Native shells call this for Back: 'handled' if consumed, 'exit' otherwise.
      window.__handleBack = () => {
        const s = Game.state();
        if (s === "play") {
          Game.pause();
          return "handled";
        }
        if (s === "paused") {
          Game.act();
          return "handled";
        }
        return "exit";
      };
      if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
        navigator.serviceWorker.register("./sw.js").catch(() => {});
    </script>
