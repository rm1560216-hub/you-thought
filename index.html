<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>IMPOSSIBLE: The Rage Protocol</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
html,body{margin:0;height:100%;height:100dvh;background:#07090f;overflow:hidden;overscroll-behavior:none;
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
body{display:flex;align-items:center;justify-content:center}
canvas{-webkit-touch-callout:none;touch-action:none;background:#0b0f1a}
#pad{display:none;position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom));justify-content:space-between;padding:0 16px;pointer-events:none}
#pad button{pointer-events:auto;touch-action:none;width:84px;height:84px;border-radius:50%;border:2px solid #556;background:#1a2030cc;color:#fff;font-size:28px}
</style></head><body>
<canvas id="c" width="960" height="540"></canvas>
<div id="pad"><div><button data-k="left">◀</button> <button data-k="right">▶</button></div><button data-k="jump">▲</button></div>
<script>
'use strict';
// DEV flag: OFF in the shipped file. No admin/debug bypass exists anywhere.
const __DEV__ = false;
// Why namespaced IIFEs and not <script type="module">: file:// blocks ES modules, so double-click would break.
// AUDIO NOTE: browsers block audio until a user gesture. Only start sound from key/pointer handlers, never on load.

const DT = 1000 / 60; // fixed 60 Hz timestep: same physics on 60/120/144 Hz screens

// ---------- RNG: seeded so layouts change per death but stay reproducible ----------
const RNG = (() => {
  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  return { make: mulberry32 };
})();

// ---------- Audit: local anomaly log. "suspected" never becomes a ban. ----------
const Audit = (() => {
  const log = []; let msgTicks = 0;
  return {
    flag(kind, confirmed) { log.push({ kind, confirmed: !!confirmed, t: Date.now() }); if (log.length > 50) log.shift(); msgTicks = 180; },
    banner() { if (msgTicks > 0) { msgTicks--; return 'The Protocol detected an anomaly. (suspected, not confirmed)'; } return ''; },
    count() { return log.length; }
  };
})();

// ---------- Save: versioned, schema-validated, best-effort (localStorage may be blocked/evicted) ----------
const Save = (() => {
  const KEY = 'impossible.save', DEFAULT = { version: 1, level: 0, deaths: 0, totalTicks: 0 };
  const isInt = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;
  function validate(o) { // reject wrong types, out-of-range, negatives, unknown versions
    if (!o || typeof o !== 'object' || o.version !== 1) return null;
    if (!isInt(o.level, 0, 9) || !isInt(o.deaths, 0, 1e7) || !isInt(o.totalTicks, 0, 1e9)) return null;
    return { version: 1, level: o.level, deaths: o.deaths, totalTicks: o.totalTicks };
  }
  // Migration hook: when version 2 exists, convert v1 -> v2 here before validate().
  function load() { try { return validate(JSON.parse(localStorage.getItem(KEY))) || { ...DEFAULT }; } catch (e) { return { ...DEFAULT }; } }
  function write(s) { try { const v = validate(s); if (v) localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} }
  return { load, write, validate };
})();

// ---------- TrustedValidation: contract for a FUTURE backend. Local stub never claims verification. ----------
const TrustedValidation = {
  // record = {levelOrder[], perLevelMs[], totalMs, deaths, seed, eventLogHash}
  // A real server must replay/validate order, durations, trap events and sign results. Keys live only on the server.
  submitRun(record) { return { verified: false, note: 'locally recorded, not server-verified' }; }
};

// ---------- Anthem: single-instance synthesized music, no audio files ----------
const Anthem = (() => {
  let token = null, ctx = null, master = null, muted = false, nodes = [];
  return {
    start() {
      if (token) return; // duplicate guard: only one anthem may exist
      try {
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        master = master || ctx.createGain(); master.gain.value = muted ? 0 : 0.08; master.connect(ctx.destination);
        const notes = [220, 261.6, 329.6, 392, 329.6, 261.6, 196, 246.9], t0 = ctx.currentTime;
        for (let i = 0; i < 120; i++) { // 60 s of notes scheduled up front
          const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = notes[i % 8] * (i % 16 < 8 ? 1 : 0.75);
          o.connect(master); o.start(t0 + i * 0.5); o.stop(t0 + i * 0.5 + 0.4); nodes.push(o);
        }
        token = {};
      } catch (e) { token = {}; }
    },
    stop() { nodes.forEach(o => { try { o.stop(); } catch (e) {} }); nodes = []; token = null; },
    toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.08; return muted; },
    isMuted() { return muted; }, isPlaying() { return !!token; }
  };
})();

// ---------- Input: keyboard + pointer; everything released when tab hidden ----------
const Input = (() => {
  const s = { left: false, right: false, jump: false }; let enter = false, reset = false;
  const map = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'jump', w: 'jump', W: 'jump', ' ': 'jump' };
  function release() { s.left = s.right = s.jump = false; }
  addEventListener('keydown', e => {
    if (e.key === 'Escape') { window.__handleBack(); return; }
    if (e.key === 'Enter') enter = true; else if (e.key === 'r' || e.key === 'R') reset = true; else if (e.key === 'm' || e.key === 'M') Anthem.toggleMute();
    if (map[e.key]) { s[map[e.key]] = true; e.preventDefault(); }
  });
  addEventListener('keyup', e => { if (map[e.key]) s[map[e.key]] = false; });
  document.addEventListener('visibilitychange', () => { if (document.hidden) release(); });
  addEventListener('blur', release);
  addEventListener('contextmenu', e => e.preventDefault());
  document.querySelectorAll('#pad button').forEach(b => { // pointer events only (click is unreliable on iOS)
    const k = b.dataset.k;
    b.addEventListener('pointerdown', e => { e.preventDefault(); s[k] = true; });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => b.addEventListener(t, () => { s[k] = false; }));
  });
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.getElementById('pad').style.display = 'flex';
  return { s, takeEnter() { const v = enter; enter = false; return v; }, takeReset() { const v = reset; reset = false; return v; }, pressEnter() { enter = true; } };
})();

// ---------- Traps: registry + factories. Families evolve the more earlier levels used them. ----------
const Traps = (() => {
  const LEVELS = [
    ['HELLO, PAIN', ['spike', 'ghost', 'saw']], ['TRUST ISSUES', ['spike', 'fake', 'turret']],
    ['MIRAGE', ['ghost', 'fakeGoal', 'crusher']], ['SNIPER ALLEY', ['turret', 'saw', 'spike']],
    ['LOW CEILING', ['crusher', 'mover', 'ghost']], ['FALSE FLOOR', ['fake', 'saw', 'turret', 'spike']],
    ['DEJA VU', ['fakeGoal', 'ghost', 'crusher', 'saw']], ['CROSSFIRE', ['turret', 'mover', 'crusher', 'fake']],
    ['EVERYTHING', ['spike', 'ghost', 'fake', 'saw', 'turret']], ['THE RAGE PROTOCOL', ['crusher', 'turret', 'fakeGoal', 'ghost', 'saw']]];
  // Registry: tier = how many earlier levels introduced this family -> faster / doubled variants.
  function tier(fam, lvl) { let n = 0; for (let i = 0; i < lvl; i++) if (LEVELS[i][1].includes(fam)) n++; return n; }
  const FLOOR = 480, SLOTS = [150, 270, 390, 510, 630, 750];
  const F = { // reusable factories; rect() returns the lethal box (or null)
    spike: (x, t) => ({ t: 'spike', x, w: t >= 2 ? 48 : 24, rect() { return { x: this.x, y: FLOOR - 20, w: this.w, h: 20 }; } }),
    ghost: (x, t) => ({ t: 'ghost', x, w: 24 + (t >= 1 ? 12 : 0), rect() { return { x: this.x, y: FLOOR - 20, w: this.w, h: 20 }; } }),
    saw: (x, t) => ({ t: 'saw', x, bx: x, sp: 1 + t * 0.3, ph: 0, rect() { return { x: this.x - 14, y: FLOOR - 28, w: 28, h: 28 }; },
      update() { this.ph += this.sp / 40; this.x = this.bx + Math.sin(this.ph) * 30; } }),
    turret: (x, t) => ({ t: 'turret', x, cd: 60, rate: 120 / (1 + t * 0.25), b: [], rect() { return null; },
      update() { if (--this.cd <= 0) { this.cd = this.rate; this.b.push({ x: this.x, y: FLOOR - 24 }); if (this.b.length > 4) this.b.shift(); }
        this.b.forEach(b => b.x -= 3); }, hits(p) { return this.b.some(b => p.x < b.x + 8 && p.x + p.w > b.x && p.y < b.y + 6 && p.y + p.h > b.y); } }),
    crusher: (x, t) => ({ t: 'crusher', x, w: 40, len: 60, st: 0, hold: 0, rect() { return { x: this.x, y: 0, w: this.w, h: this.len }; },
      update(p) { const sp = 14 + t * 2;
        if (this.st === 0 && p.x + p.w > this.x - 10 && p.x < this.x + this.w + 10) this.st = 1;
        if (this.st === 1) { this.len += sp; if (this.len >= FLOOR) { this.len = FLOOR; this.st = 2; this.hold = 40; window.__shake && window.__shake(); } }
        else if (this.st === 2 && --this.hold <= 0) this.st = 3;
        else if (this.st === 3) { this.len -= 4; if (this.len <= 60) { this.len = 60; this.st = 0; } } } }),
    fake: (x) => ({ t: 'fake', x, rect() { return null; } }),          // becomes a falling floor tile in build()
    mover: (x, t) => ({ t: 'mover', x, bx: x, y: 400, w: 70, h: 10, ph: 0, dx: 0, rect() { return null; },
      update() { const o = this.x; this.ph += 0.025 + t * 0.005; this.x = this.bx + Math.sin(this.ph) * 40; this.dx = this.x - o; } }),
    fakeGoal: (x) => ({ t: 'fakeGoal', x, w: 30, rect() { return { x: this.x, y: FLOOR - 60, w: 30, h: 60 }; } })
  };
  // Solvability check (simplified, NOT full swept-AABB): hazards must be narrow enough for the jump envelope
  // (~120 px of air travel) and spaced so there is landing room between them.
  function validateRoute(list) {
    const hz = list.filter(o => o.rect && o.t !== 'mover').map(o => o.x).sort((a, b) => a - b);
    for (let i = 0; i < list.length; i++) if (list[i].w && list[i].w > 64) return false;
    for (let i = 1; i < hz.length; i++) if (hz[i] - hz[i - 1] < 100) return false;
    return true;
  }
  function generate(lvl, rng) {
    const fams = LEVELS[lvl][1];
    for (let attempt = 0; attempt < 8; attempt++) {
      const slots = SLOTS.slice().sort(() => rng() - 0.5), list = [];
      const n = Math.min(6, Math.max(fams.length, 3 + (lvl >> 1)));
      for (let i = 0; i < n; i++) { const f = fams[i < fams.length ? i : Math.floor(rng() * fams.length)];
        list.push(F[f](slots[i] + Math.floor(rng() * 30), tier(f, lvl))); }
      if (validateRoute(list)) return list;
    }
    return [F.spike(400, 0), F.saw(640, 0), F.ghost(250, 0)]; // deterministic safe fallback
  }
  return { LEVELS, generate, FLOOR, tier };
})();

// ---------- Progression: the ONLY way to advance is requestLevelComplete(proof) ----------
const Progression = (() => {
  let level = 0; const done = {};
  return {
    level: () => level, set(l) { level = l; },
    requestLevelComplete(proof) {
      // Every check below rejects forged or out-of-order completions.
      if (!proof || proof.hit !== true) return Audit.flag('no goal collision'), false;
      if (proof.level !== level) return Audit.flag('wrong level'), false;
      if (proof.target !== level + 1) return Audit.flag('level jump'), false;
      if (done[level]) return Audit.flag('duplicate completion'), false;
      if (!proof.events || !proof.events.includes('goal:' + level)) return Audit.flag('event log inconsistent'), false;
      done[level] = true; return true;
    },
    advance() { level++; }, reset() { level = 0; for (const k in done) delete done[k]; }
  };
})();

// ---------- Rival taunts: random, no repeats until pool cycles ----------
const Rival = (() => {
  const pool = ['Skill issue.', 'That platform was a lie.', 'The level is fine. The level is FINE.', 'Again? Bold.', 'Have you tried not dying?',
    'I would clap, but no.', 'Spikes: 1. You: 0.', 'Impressive. Impressively bad.', 'Is your keyboard okay?', 'Nice try. Truly.', 'Gravity sends regards.', 'I believed in you. Briefly.'];
  let bag = [];
  return { next() { if (!bag.length) bag = pool.slice().sort(() => Math.random() - 0.5); return bag.pop(); } };
})();

// ---------- Game: state machine, physics, collision, stats, render ----------
const Game = (() => {
  const cv = document.getElementById('c'), g = cv.getContext('2d'), FLOOR = Traps.FLOOR;
  const p = { x: 30, y: FLOOR - 28, w: 20, h: 28, vx: 0, vy: 0, coy: 0, buf: 0, stand: null }, prevJump = { v: false };
  const sv = Save.load(); const runSeed = (Date.now() & 0xffffff) | 0;
  let state = 'title', deaths = sv.deaths, totalTicks = sv.totalTicks, levelTicks = 0, deadTicks = 0, frame = 0, shake = 0;
  let traps = [], tiles = [], events = [], taunt = '', tauntT = 0, startReal = 0, simMs = 0;
  const parts = Array.from({ length: 40 }, () => ({ x: 0, y: 0, vx: 0, vy: 0, l: 0 })); // capped pool, no per-frame allocation
  window.__shake = () => { shake = 10; };

  function buildTiles() {
    tiles = [{ x: 0, y: FLOOR, w: 960, h: 60, fake: false }];
    traps.filter(t => t.t === 'fake').forEach(t => { // carve a fake tile that looks identical, falls after a short grace
      tiles = tiles.flatMap(r => r.x <= t.x && t.x < r.x + r.w ? [{ x: r.x, y: FLOOR, w: t.x - r.x, h: 60, fake: false },
        { x: t.x, y: FLOOR, w: 60, h: 60, fake: true, stand: 0, fall: false, vy: 0 }, { x: t.x + 60, y: FLOOR, w: r.x + r.w - t.x - 60, h: 60, fake: false }] : [r]); });
  }
  function loadLevel() {
    const lvl = Progression.level();
    const rng = RNG.make(runSeed ^ (lvl * 7919) ^ (deaths * 104729)); // per run + level + death
    traps = Traps.generate(lvl, rng); buildTiles(); respawn(); events = []; levelTicks = 0; simMs = 0; startReal = performance.now(); state = 'play';
  }
  function respawn() { p.x = 30; p.y = FLOOR - p.h; p.vx = p.vy = 0; p.stand = null; }
  function kill(why) {
    if (state !== 'play') return; // duplicate death/restart requests are ignored
    deaths++; Save.write({ version: 1, level: Progression.level(), deaths, totalTicks }); shake = 20;
    for (const q of parts) { q.x = p.x + 10; q.y = p.y + 14; q.vx = (Math.random() - 0.5) * 8; q.vy = -Math.random() * 7; q.l = 40; }
    state = 'dead'; deadTicks = 3600; taunt = Rival.next(); tauntT = 3600; Anthem.start();
  }
  const hit = (a, b) => b && a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  function step() {
    frame++;
    if (shake > 0) shake -= 0.5;
    parts.forEach(q => { if (q.l > 0) { q.l--; q.x += q.vx; q.y += q.vy; q.vy += 0.3; } });
    if (state === 'dead') { // countdown runs on simulation ticks; Enter/R/jump cannot skip it
      Input.takeEnter(); Input.takeReset();
      if (--deadTicks <= 0) { Anthem.stop(); loadLevel(); }
      return;
    }
    if (state === 'title') { if (Input.takeEnter()) { Progression.set(sv.level); loadLevel(); } return; }
    if (state === 'complete') { if (Input.takeEnter()) { Progression.advance(); loadLevel(); } return; }
    if (state === 'victory') { if (Input.takeEnter()) { Progression.reset(); deaths = 0; totalTicks = 0; Save.write({ version: 1, level: 0, deaths: 0, totalTicks: 0 }); state = 'title'; } return; }
    // ---- state === 'play' ----
    Input.takeEnter(); if (Input.takeReset()) { respawn(); return; }
    levelTicks++; totalTicks++; simMs += DT; tauntT--;
    if (tauntT <= 0 && Math.random() < 0.002) { taunt = Rival.next(); tauntT = 300; }
    traps.forEach(t => t.update && t.update(p));
    tiles.forEach(t => { if (t.fake && t.fall) { t.vy += 0.6; t.y += t.vy; } });
    const mover = traps.find(t => t.t === 'mover');
    const px0 = p.x, py0 = p.y, pb = p.y + p.h;
    if (p.stand && p.stand.dx !== undefined) p.x += p.stand.dx; // carried by moving platform
    const s = Input.s; p.vx = (s.right ? 3.2 : 0) - (s.left ? 3.2 : 0);
    if (s.jump && !prevJump.v) p.buf = 6; prevJump.v = s.jump; // jump buffer
    p.x = Math.max(0, Math.min(940, p.x + p.vx));
    if (p.coy > 0) p.coy--; if (p.buf > 0) p.buf--;
    if (p.buf > 0 && p.coy > 0) { p.vy = -9.5; p.buf = 0; p.coy = 0; p.stand = null; }
    if (!s.jump && p.vy < -4) p.vy = -4; // short hop
    p.vy = Math.min(11, p.vy + 0.5); p.y += p.vy; p.stand = null;
    const solids = tiles.filter(t => !(t.fake && t.fall)); if (mover) solids.push(mover);
    for (const t of solids) {
      if (p.vy >= 0 && p.x + p.w > t.x && p.x < t.x + t.w && pb <= t.y + 1 && p.y + p.h >= t.y) {
        p.y = t.y - p.h; p.vy = 0; p.coy = 6; p.stand = t; if (t.fake && ++t.stand >= 10) t.fall = true; }
    }
    // Hazards: each lethal rect is tested every tick, so you cannot pass through one without a collision event.
    for (const t of traps) { const r = t.rect && t.rect(); if (r && t.t !== 'mover' && hit(p, r)) { kill(t.t); return; } if (t.hits && t.hits(p)) { kill('bullet'); return; } }
    if (p.y > 560) { kill('fall'); return; }
    // ---- anomaly detection: O(1), generous limits so carry/coyote/buffer/blur never trigger it ----
    if (Math.abs(p.x - px0) > 3.2 + 4 || Math.abs(p.y - py0) > 15 || (frame % 600 === 0 && simMs > (performance.now() - startReal) * 1.5 + 3000)) {
      Audit.flag('movement/timer', false); respawn(); return; // restore a safe state, no ban, no crash
    }
    // ---- goal ----
    if (p.x + p.w > 900) { events.push('goal:' + Progression.level());
      const lvl = Progression.level();
      if (Progression.requestLevelComplete({ hit: true, level: lvl, target: lvl + 1, events })) {
        Save.write({ version: 1, level: Math.min(9, lvl + 1), deaths, totalTicks });
        if (lvl === 9) { state = 'victory'; TrustedValidation.submitRun({ seed: runSeed, deaths, totalMs: totalTicks * DT }); } else state = 'complete';
        taunt = Rival.next(); tauntT = 600; } else respawn(); }
  }

  const fmt = t => { const s = Math.floor(t / 60); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  function draw() {
    const lvl = Progression.level();
    g.save(); g.fillStyle = '#0b0f1a'; g.fillRect(0, 0, 960, 540);
    if (shake > 0) g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    g.fillStyle = '#2b3550'; tiles.forEach(t => { if (!(t.fake && t.y > 600)) g.fillRect(t.x, t.y, t.w, t.h); });
    g.fillStyle = '#35e08a'; g.fillRect(900, FLOOR - 60, 30, 60);
    traps.forEach(t => {
      if (t.t === 'spike' || (t.t === 'ghost' && Math.abs(p.x - t.x) < 90)) { g.fillStyle = '#e04050'; const r = t.rect(); for (let x = r.x; x < r.x + r.w; x += 12) { g.beginPath(); g.moveTo(x, FLOOR); g.lineTo(x + 6, FLOOR - 20); g.lineTo(x + 12, FLOOR); g.fill(); } }
      else if (t.t === 'saw') { g.fillStyle = '#c8c8d8'; g.beginPath(); g.arc(t.x, FLOOR - 14, 14, 0, 6.3); g.fill(); }
      else if (t.t === 'turret') { g.fillStyle = '#8a6'; g.fillRect(t.x, FLOOR - 30, 20, 30); g.fillStyle = '#fc4'; t.b.forEach(b => g.fillRect(b.x, b.y, 8, 6)); }
      else if (t.t === 'crusher') { g.fillStyle = '#777'; g.fillRect(t.x, 0, t.w, t.len); }
      else if (t.t === 'mover') { g.fillStyle = '#4a7bd0'; g.fillRect(t.x, t.y, t.w, t.h); }
      else if (t.t === 'fakeGoal') { g.fillStyle = '#35e08a'; g.fillRect(t.x, FLOOR - 60, 30, 60); } // visually identical to the real goal
    });
    if (state !== 'dead') { g.fillStyle = '#f5f5f5'; g.fillRect(p.x, p.y, p.w, p.h); }
    g.fillStyle = '#f5a'; parts.forEach(q => { if (q.l > 0) g.fillRect(q.x, q.y, 4, 4); });
    g.restore();
    // rival: rectangle with a face + taunt
    g.fillStyle = '#933'; g.fillRect(860, 20, 40, 40); g.fillStyle = '#fff'; g.fillRect(868, 32, 6, 6); g.fillRect(886, 32, 6, 6); g.fillRect(870, 48, 20, 3);
    g.font = '16px monospace'; g.textAlign = 'right'; g.fillStyle = '#ddd'; if (tauntT > 0 && taunt) g.fillText(taunt, 850, 45);
    g.textAlign = 'left'; g.fillText((Traps.LEVELS[lvl][0]) + ' (' + (lvl + 1) + '/10)  Deaths ' + deaths + '  Level ' + fmt(levelTicks) + '  Total ' + fmt(totalTicks), 16, 24);
    g.fillStyle = '#889'; g.fillText('Locally recorded, not server-verified. [M] mute', 16, 530);
    const b = Audit.banner(); if (b) { g.fillStyle = '#fc4'; g.fillText(b, 16, 48); }
    g.textAlign = 'center'; g.fillStyle = '#fff'; g.font = '32px monospace';
    if (state === 'title') { g.fillText('IMPOSSIBLE: THE RAGE PROTOCOL', 480, 220); g.font = '18px monospace'; g.fillText('Press Enter / tap to start', 480, 270); }
    if (state === 'dead') { g.fillText('YOU DIED', 480, 220); g.font = '22px monospace'; g.fillText('Respawn in ' + Math.ceil(deadTicks / 60) + 's', 480, 265); g.fillText(taunt, 480, 305); }
    if (state === 'complete') { g.fillText('LEVEL COMPLETE', 480, 240); g.font = '18px monospace'; g.fillText('Enter / tap to continue', 480, 280); }
