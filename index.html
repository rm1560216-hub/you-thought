<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>You Thought.</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="A tiny, innocent platformer." />
    <meta name="theme-color" content="#07090f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07090f;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, sans-serif;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #wrap {
        position: relative;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        -webkit-touch-callout: none;
      }
      #ov {
        position: absolute;
        inset: 0;
        display: none;
        background: rgba(0, 0, 0, 0.68);
        color: #fff;
        text-align: center;
      }
      #msg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(92%, 900px);
        font-size: clamp(22px, 4vw, 44px);
        font-weight: 600;
        line-height: 1.15;
        overflow-wrap: anywhere;
      }
      #msg.big {
        font-size: clamp(30px, 8vw, 96px);
        font-weight: 800;
      }
      #bt {
        position: absolute;
        left: 50%;
        bottom: 8%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
      }
      #bt button,
      #pz {
        font: 700 clamp(16px, 2.4vw, 24px) system-ui;
        padding: 0.5em 1.4em;
        border: 2px solid #fff;
        border-radius: 8px;
        background: #fff;
        color: #07090f;
        cursor: pointer;
        touch-action: none;
      }
      #bt button.alt {
        background: transparent;
        color: #fff;
      }
      #pz {
        display: none;
        position: absolute;
        top: 8px;
        right: 14px;
        padding: 0.2em 0.7em;
        font-size: 18px;
        opacity: 0.85;
      }
      #pad {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(8px + env(safe-area-inset-bottom));
        justify-content: space-between;
        padding: 0 16px;
        pointer-events: none;
      }
      #pad button {
        pointer-events: auto;
        touch-action: none;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 2px solid #667;
        background: #1a2030b0;
        color: #fff;
        font-size: 26px;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="c" width="960" height="540"></canvas
      ><button id="pz" aria-label="Pause">❚❚</button>
      <div id="ov">
        <div id="msg"></div>
        <div id="bt"><button id="b1"></button><button id="b2" class="alt"></button></div>
      </div>
    </div>
    <div id="pad">
      <div><button data-k="left">◀</button> <button data-k="right">▶</button></div>
      <button data-k="jump">▲</button>
    </div>
    <script>
      "use strict";
      // No audio starts before a user gesture (Start/Play button), so autoplay rules never silence the game.
      const W = 960,
        H = 540,
        DT = 1000 / 60,
        GY = 0.5,
        JV = -9.6,
        SP = 3.2;
      const $ = (id) => document.getElementById(id);
      const RNG = {
        make(a) {
          return () => {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        },
      };
      const runSeed =
        +new URLSearchParams(location.search).get("seed") | 0 || Date.now() & 0xffffff; // ?seed=123 reproduces timings
      console.info("seed", runSeed);

      // ---- Save: versioned + validated; fake doors/traps never touch it ----
      const Save = (() => {
        const K = "youthought.save",
          ok = (o) =>
            o &&
            typeof o === "object" &&
            o.v === 1 &&
            Number.isInteger(o.hi) &&
            o.hi >= 0 &&
            o.hi <= 9 &&
            Number.isInteger(o.done) &&
            o.done >= 0 &&
            o.done < 1024 &&
            Number.isInteger(o.deaths) &&
            o.deaths >= 0 &&
            o.deaths < 1e7 &&
            typeof o.vol === "number" &&
            o.vol >= 0 &&
            o.vol <= 1 &&
            typeof o.mute === "boolean" &&
            (o.st === undefined ||
              (Array.isArray(o.st) &&
                o.st.length <= 10 &&
                o.st.every(
                  (p) =>
                    Array.isArray(p) &&
                    p.length === 2 &&
                    Number.isInteger(p[0]) &&
                    Number.isInteger(p[1]) &&
                    p[0] >= 0 &&
                    p[0] < 1e6 &&
                    p[1] >= 0 &&
                    p[1] <= p[0],
                )));
        let d = { v: 1, hi: 0, done: 0, deaths: 0, vol: 0.5, mute: false, st: [] };
        try {
          const o = JSON.parse(localStorage.getItem(K));
          if (ok(o)) d = { st: [], ...o };
        } catch (e) {}
        return {
          d,
          // Local-only pass-rate counter: bump tries when a level starts, wins when the real door is used.
          count(lvl, win) {
            const st = d.st;
            while (st.length <= lvl) st.push([0, 0]);
            if (win) st[lvl][1] = Math.min(st[lvl][1] + 1, st[lvl][0]);
            else st[lvl][0]++;
            this.w();
          },
          w() {
            try {
              if (ok(d)) localStorage.setItem(K, JSON.stringify(d));
            } catch (e) {}
          },
          reset() {
            d.hi = 0;
            d.done = 0;
            d.deaths = 0;
            d.st.length = 0;
            this.w();
          },
        };
      })();

      // ---- Audio: procedural 20 s loop (every note fades to 0 before the loop point = seamless) ----
      const Snd = (() => {
        let ctx, gain, src;
        function init() {
          if (ctx) return true;
          try {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
            gain = ctx.createGain();
            gain.connect(ctx.destination);
            vol();
            return true;
          } catch (e) {
            return false;
          }
        }
        function vol() {
          if (gain) gain.gain.value = Save.d.mute ? 0 : Save.d.vol * 0.4;
        }
        function buf(root) {
          const sr = 22050,
            b = ctx.createBuffer(1, 20 * sr, sr),
            d = b.getChannelData(0),
            sc = [0, 3, 5, 7, 10, 7, 5, 3];
          for (let s = 0; s < 40; s++) {
            const f = root * Math.pow(2, sc[(s * 3 + (s >> 3)) % 8] / 12),
              i0 = ((s * sr) / 2) | 0;
            for (let i = 0; i < sr / 2; i++) {
              const t = i / (sr / 2),
                e = (1 - t) * (1 - t);
              d[i0 + i] +=
                Math.sin((6.2832 * f * i) / sr) * e * 0.25 +
                (s % 4 === 0 ? Math.sin((3.1416 * f * i) / sr) * e * 0.3 : 0);
            }
          }
          return b;
        }
        return {
          vol,
          music(l) {
            if (!init()) return;
            this.stop();
            try {
              if (ctx.state === "suspended") ctx.resume();
              src = ctx.createBufferSource();
              src.buffer = buf(110 * Math.pow(2, ((l * 2) % 12) / 12));
              src.loop = true;
              src.connect(gain);
              src.start();
            } catch (e) {}
          },
          stop() {
            try {
              if (src) {
                src.stop();
                src = null;
              }
            } catch (e) {}
          },
          sfx(f, t) {
            if (!ctx || Save.d.mute) return;
            try {
              const o = ctx.createOscillator(),
                g2 = ctx.createGain();
              o.frequency.value = f;
              g2.gain.value = 0.05 * Save.d.vol;
              o.connect(g2);
              g2.connect(ctx.destination);
              o.start();
              o.stop(ctx.currentTime + t);
            } catch (e) {}
          },
        };
      })();

      // ---- Input ----
      const Input = (() => {
        const s = { left: false, right: false, jump: false },
          map = {
            ArrowLeft: "left",
            a: "left",
            A: "left",
            ArrowRight: "right",
            d: "right",
            D: "right",
            ArrowUp: "jump",
            w: "jump",
            W: "jump",
            " ": "jump",
          };
        const rel = () => {
          s.left = s.right = s.jump = false;
        };
        addEventListener("keydown", (e) => {
          if (map[e.key]) {
            s[map[e.key]] = true;
            e.preventDefault();
          }
          if (e.repeat) return;
          if (e.key === "Enter") Game.act();
          else if (e.key === "r" || e.key === "R") {
            if (Game.state() === "dead") Game.act();
          } else if (e.key === "m" || e.key === "M") Game.mute();
          else if (e.key === "p" || e.key === "P" || e.key === "Escape") window.__handleBack();
        });
        addEventListener("keyup", (e) => {
          if (map[e.key]) s[map[e.key]] = false;
        });
        addEventListener("blur", rel);
        addEventListener("contextmenu", (e) => e.preventDefault());
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            rel();
            Game.autoPause();
          }
        });
        document.querySelectorAll("#pad button").forEach((b) => {
          const k = b.dataset.k;
          b.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            s[k] = true;
          });
          ["pointerup", "pointercancel", "pointerleave"].forEach((t) =>
            b.addEventListener(t, () => {
              s[k] = false;
            }),
          );
        });
        if ("ontouchstart" in window || navigator.maxTouchPoints > 0)
          $("pad").style.display = "flex";
        return { s };
      })();

      // ---- Object model: every trap owns its state machine; no global trap timer ----
      const mk = (t, a) =>
        Object.assign(
          {
            t,
            sx: 0,
            sy: 0,
            sw: 0,
            sh: 0,
            lx: 0,
            ly: 0,
            lw: 0,
            lh: 0,
            st: 0,
            ad: 0,
            cd: 0,
            tm: 0,
            h: 0,
            len: 0,
          },
          a,
        );
      const F = (x, y, w) => mk("F", { x, y, w, sx: x, sy: y, sw: w, sh: H - y });
      const B = (x, w, h) => mk("B", { x, y: 0, w, h, sx: x, sy: 0, sw: w, sh: h });
      const K = (x, y, w) => mk("K", { x, y, w, lx: x, ly: y, lw: w, lh: H - y });
      const C = (x, y, w, m, d, link, id) =>
        mk("C", {
          x,
          y,
          w,
          m,
          d,
          link,
          id,
          sx: x,
          sy: y,
          sw: w,
          sh: 16,
          vy: 0,
          mo: 0,
          ms: 0,
          dir: 1,
          dist: 0,
          sl: 0,
          rs: 1,
          lead: 30,
        });
      const G = (x, y, w, m, o) => mk("G", { x, y, w, m, rad: 70, dur: 60, per: 150, ...o });
      const S = (x, y, w, m, o) =>
        mk("S", { x, y, w, m, rad: 60, sp: 5, max: 150, dur: 60, per: 180, d: 15, ...o });
      const Pf = (x, y, w, o) =>
        mk("P", { x, y, w, fy: y + 110, sp: 1.3, d: 15, at: 60, ld: 5, ...o });
      const Wl = (x, y, w, h, m, o) =>
        mk("W", {
          x,
          y,
          w,
          h,
          m,
          sx: x,
          sy: y,
          sw: w,
          sh: h,
          pos: 0,
          v: 2,
          dist: 150,
          rg: 100,
          d: 20,
          dx: 0,
          ph: 0,
          amp: 30,
          dir: 1,
          hold: 90,
          ...o,
        });
      const D = (id, x, y, o) =>
        mk("D", { id, x, y, hx: x, w: 30, h: 46, sx: x, sy: y - 46, n: 0, real: 1, ...o });
      let objs = [],
        byId = {},
        pl = {
          x: 40,
          y: 414,
          vx: 0,
          vy: 0,
          c: 0,
          b: 0,
          stand: null,
          ls: null,
          j: false,
          f: 1,
          t: 0,
          s: "idle",
          lt: 0,
        },
        tick = 0,
        colTick = -999;
      // One-trap-at-a-time rule: a trap may only start on its own while no other trap is active.
      // Linked/chained traps (force) are part of the same trap. A moving door counts as a trap.
      function busy(self) {
        for (let i = 0; i < objs.length; i++) {
          const o = objs[i];
          if (o === self) continue;
          if (o.t === "G" || o.t === "S") {
            if (o.st !== 0 || o.ad > 0) return true;
          } else if (o.t === "C") {
            if (o.ad > 0 || o.st === 2 || o.st >= 6 || o.ms > 0) return true;
          } else if (o.t === "W") {
            if (
              o.m === "surge"
                ? o.st >= 1 && o.st <= 3
                : o.m === "appear"
                  ? o.st === 1 || o.st === 2
                  : o.m === "false" && o.st === 1
            )
              return true;
          } else if (o.t === "P") {
            if (o.st === 1) return true;
          } else if (o.t === "D") {
            if (o.real && o.st !== 0) return true;
          }
        }
        return false;
      }
      function trig(o, d, force) {
        if (o && o.st === 0 && o.ad === 0 && !(o.cd > 0) && (force || !busy(o)))
          o.ad = Math.max(1, d | 0);
      }
      const ovr = (a, b, c, d, e, f, g_, h) => a < e + g_ && a + c > e && b < f + h && b + d > f;
      function pushOut(o) {
        if (pl.x + 7 < o.sx + o.sw / 2) pl.x = o.sx - 14;
        else pl.x = o.sx + o.sw;
        pl.x = Math.max(10, Math.min(W - 24, pl.x));
        pl.s = "hit";
      }
      const near = (o) => Math.abs(pl.x + 7 - (o.x + o.w / 2));

      // Each panel/pit owns its own random stream, so no two behave in sync.
      function nextRand(o) {
        o.rs = (Math.imul(o.rs, 1664525) + 1013904223) >>> 0;
        return o.rs / 4294967296;
      }
      const U = {
        C(o) {
          if (o.st === 0) {
            if (pl.stand === o && o.m !== "safe" && o.m !== "take" && o.m !== "solid") trig(o, o.d);
            if (o.m === "take" && pl.j && pl.ls === o) trig(o, 3);
            // Stair-slam: this higher panel slides over the lower one you stand on, drops, and crushes you.
            if (o.m === "slam" && byId[o.tgt] && pl.stand === byId[o.tgt]) trig(o, o.d);
            // Surprise pit: opens a few steps before the edge, with no warning shake.
            if (o.m === "pit" && pl.stand && pl.x + 7 > o.x - o.lead)
              trig(o, 2 + ((nextRand(o) * 4) | 0));
          }
          // Sliding panel: may shift sideways when the player jumps toward it, then returns.
          if (o.sl && o.st === 0) {
            const prev = o.mo;
            if (o.ms === 0) {
              if (
                !pl.stand &&
                pl.air > 6 &&
                pl.air < 30 &&
                Math.abs(pl.x + 7 - (o.x + o.mo + o.w / 2)) < 150 &&
                nextRand(o) < 0.07 &&
                !busy(o)
              ) {
                o.ms = 1;
                o.dir = nextRand(o) < 0.5 ? -1 : 1;
                o.dist = 30 + nextRand(o) * 15;
              }
            } else if (o.ms === 1) {
              o.mo += o.dir * 12; // abrupt
              if (Math.abs(o.mo) >= o.dist) {
                o.ms = 2;
                o.tm = (45 + nextRand(o) * 25) | 0;
              }
            } else if (o.ms === 2) {
              if (--o.tm <= 0) o.ms = 3;
            } else {
              o.mo -= Math.sign(o.mo) * Math.min(3, Math.abs(o.mo));
              if (Math.abs(o.mo) < 0.5) {
                o.mo = 0;
                o.ms = 0;
              }
            }
            if (pl.stand === o) pl.x += o.mo - prev; // panel carries the player
            if (o.ms === 0 && pl.stand !== o && nextRand(o) < 0.0015 && !busy(o)) {
              // drifts at random even if you never jump
              o.ms = 1;
              o.dir = nextRand(o) < 0.5 ? -1 : 1;
              o.dist = 30 + nextRand(o) * 15;
            }
          }
          if (o.ad > 0 && --o.ad === 0) {
            colTick = tick;
            Snd.sfx(150, 0.12);
            if (o.link) trig(byId[o.link], 24, true);
            if (o.m === "part") {
              o.sx = o.x + o.w / 2;
              o.sw = o.w / 2;
              o.st = 4;
            } else if (o.m === "slam") {
              o.st = 6;
            } else if (o.m === "pit") {
              o.sw = 0;
              o.st = 3;
              o.cd = 1e9;
            } else {
              o.st = 2;
              o.vy = 0;
            }
          }
          if (o.st === 2) {
            o.vy += 0.5;
            o.sy += o.vy;
            o.sw = 0;
            if (o.sy > H + 40) {
              o.st = 3;
              o.cd = o.m === "repeat" ? 150 : 1e9;
            }
          }
          if (o.st === 3 && --o.cd <= 0) {
            o.st = 0;
            o.sy = o.y;
            o.sw = o.w;
            o.sx = o.x;
          }
          if (o.m === "slam" && o.st >= 6) {
            const a = byId[o.tgt],
              pm = o.mo;
            if (o.st === 6) {
              const tx = a.x + a.mo - o.x;
              o.mo += Math.max(-6, Math.min(6, tx - o.mo));
              if (Math.abs(tx - o.mo) < 1.5) {
                o.st = 7;
                o.vy = 0;
              }
            } else if (o.st === 7) {
              o.vy += 1.2;
              o.sy += o.vy;
              if (o.sy >= a.sy - 16) {
                o.sy = a.sy - 16;
                o.st = 8;
                o.t2 = 45;
                Snd.sfx(100, 0.15);
              }
            } else if (o.st === 8) {
              if (--o.t2 <= 0) o.st = 9;
            } else if (o.sy > o.y) {
              o.sy = Math.max(o.y, o.sy - 3);
            } else {
              o.mo -= Math.sign(o.mo) * Math.min(4, Math.abs(o.mo));
              if (Math.abs(o.mo) < 0.5) {
                o.mo = 0;
                o.st = 0;
                o.cd = 150;
              }
            }
            if (pl.stand === o) pl.x += o.mo - pm; // riders are carried
          }
          if (o.m === "slam" && o.st === 0 && o.cd > 0) o.cd--;
          if (o.st !== 4) o.sx = o.x + o.mo;
          o.lx = o.sx;
          o.ly = o.sy;
          o.lw = o.m === "slam" && (o.st === 7 || o.st === 8) ? o.w : 0; // deadly while falling and resting on the lower panel
          o.lh = 16;
        },
        G(o) {
          if (o.st === 0) {
            if (o.m === "prox" && near(o) < o.rad && pl.stand) trig(o, o.d);
            else if (o.m === "jump" && pl.j && near(o) < o.rad) trig(o, o.d);
            else if (o.m === "timer" && --o.tm <= 0) {
              o.tm = o.per;
              trig(o, 6);
            }
          }
          if (o.ad > 0 && --o.ad === 0) {
            if (o.fake)
              o.cd = 120; // false alarm: twitches, never fires
            else {
              o.st = 1;
              Snd.sfx(700, 0.05);
            }
          }
          if (o.st === 1) {
            o.h += 3;
            if (o.h >= 20) {
              o.h = 20;
              o.st = 2;
              o.t2 = o.dur;
            }
          } else if (o.st === 2 && --o.t2 <= 0) o.st = 3;
          else if (o.st === 3) {
            o.h -= 1.5;
            if (o.h <= 0) {
              o.h = 0;
              o.st = 0;
              if (o.m !== "timer") o.cd = 90;
            }
          }
          if (o.cd > 0 && o.st === 0) o.cd--;
          o.lx = o.x;
          o.ly = o.y - o.h;
          o.lw = o.h > 2 ? o.w : 0;
          o.lh = o.h;
        },
        S(o) {
          if (o.st === 0) {
            if (o.m === "prox" && near(o) < o.rad) trig(o, o.d);
            else if (o.m === "jump" && pl.j && near(o) < o.rad + 40) trig(o, o.d);
            else if (o.m === "timer" && --o.tm <= 0) {
              o.tm = o.per;
              trig(o, 6);
            }
          }
          if (o.ad > 0 && --o.ad === 0) o.st = 1;
          if (o.st === 1) {
            o.len += o.sp;
            if (o.pz && !o.pdone && o.len >= o.max * o.pz) {
              o.pdone = 1;
              o.st = 5;
              o.t3 = o.pzt;
            }
            if (o.len >= o.max) {
              o.len = o.max;
              o.st = 2;
              o.t2 = o.dur;
            }
          } else if (o.st === 2 && --o.t2 <= 0) o.st = 3;
          else if (o.st === 3) {
            o.len -= 5;
            if (o.len <= 0) {
              o.len = 0;
              o.pdone = 0;
              o.st = 0;
              o.cd = 90;
            }
          }
          if (o.st === 5 && --o.t3 <= 0) o.st = 1; // pause over: resume descending
          if (o.cd > 0 && o.st === 0) o.cd--;
          o.lx = o.x;
          o.ly = o.y + o.len - 14;

      function validate(objs) {

      // ---- Game: state machine ----
      const TA = {

        floor: ["Why did the floor disappear?", "That floor was a lie.", "Wrong platform."],
        spike: ["Skill issue.", "That was unfortunate.", "Interesting decision."],
        wall: ["Not a bug.", "The wall had plans.", "Nice try."],

        gen: ["You thought.", "One more try?", "Surely you'll get it this time.", "Welcome back."],

      const Game = (() => {

        function show(st, c) {

                rows +

          } else if (st === "complete") {

            b1.textContent = "Again";

            j: false,

            g.lineTo(-4, 13);
            g.moveTo(0, 7);
            g.lineTo(4, 13);
            g.moveTo(0, -1);
            g.lineTo(-7, -4);
            g.moveTo(0, -1);
            g.lineTo(7, -4);

            g.moveTo(0, 7);
            g.lineTo(-3, 13);
            g.moveTo(0, 7);
            g.lineTo(3, 13);

            g.moveTo(0, -1);

            g.moveTo(0, -1);

        }

        }
        function drawObj(o, l) {
          switch (o.t) {

              g.fillStyle = "rgba(255,255,255,.2)";
              g.fillRect(o.x, o.y, o.w, 3);

            case "B":

                g.fillStyle = "rgba(255,255,255,.2)";
                g.fillRect(o.x, o.fy, o.w, 3);

            case "C":
              if (o.st === 3) break;
              {
                const j = o.ad > 0 && o.m !== "pit" ? (tick % 4 < 2 ? 1.5 : -1.5) : 0;
                const px = o.x + o.mo;
                g.fillStyle = l.fl;

                  g.lineTo(px + 20, o.sy + 16);
                  g.moveTo(px + 34, o.sy);
                  g.lineTo(px + 28, o.sy + 16);

                g.fillStyle = "#e22";

              break;
            case "S":
              if (o.ad > 0) {
                g.fillStyle = "#111";
                g.fillRect(o.x, o.y, o.w, tick % 4 < 2 ? 4 : 2);

              if (o.len > 0) {
                g.fillStyle = "#777";
                g.fillRect(o.x + o.w / 2 - 3, o.y, 6, o.len);
                g.fillStyle = "#e22";
                spikes(o.x, o.y + o.len - 14, o.w, 14, 1);
              }
              break;
            case "W":
              if (
                o.sw > 0 ||
                (o.st === 1 && o.m === "appear") ||
                (o.st === 1 && o.m === "surge" && o.tm > 0)

                g.fillStyle =
                  o.sw > 0 ? "#1d2433" : "rgba(29,36,51," + (tick % 6 < 3 ? 0.5 : 0.15) + ")";
                g.fillRect(o.sx, o.sy, o.w, o.h);

              break;
            case "D":
              if (o.dead) break;

              g.fillRect(o.x, o.sy, o.w, o.h);
              g.strokeStyle = "#555";
              g.lineWidth = 2;
              g.strokeRect(o.x, o.sy, o.w, o.h);
              g.fillStyle = "#555";
              g.fillRect(o.x + o.w - 8, o.sy + 24, 3, 3);

        function draw() {
          const l = L();
          g.fillStyle = l.bg;
          g.fillRect(0, 0, W, H);
          g.fillStyle = l.wl;
          g.fillRect(0, 0, W, l.ce);
          g.fillRect(0, 0, 10, H);
          g.fillRect(W - 10, 0, 10, H);
          for (let i = 0; i < objs.length; i++) drawObj(objs[i], l);

          g.font = "bold 16px system-ui";

            "DEATHS " + Save.d.deaths + "   SOUND " + (Save.d.mute ? "OFF" : "ON"),
            18,
            30,

            vh = window.visualViewport ? visualViewport.height : innerHeight,

          Save.reset();

        requestAnimationFrame(frame);

          act,
          complete,
          state: () => state,
          autoPause: pause,
